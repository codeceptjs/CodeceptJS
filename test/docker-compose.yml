services:
  test-rest:
    <<: &test-service
      build: ..
      entrypoint: ['']
      working_dir: /codecept
      env_file: .env
      volumes:
        - ./:/codecept/test
      environment:
        - MOCK_SERVER_HOST=mock_server
    command: ['/codecept/node_modules/.bin/mocha', 'test/rest']
    depends_on:
      json_server:
        condition: service_healthy
      mock_server:
        condition: service_started

  test-acceptance.webdriverio:
    build: ..
    env_file: .env
    working_dir: /tests
    environment:
      - CODECEPT_ARGS=-c acceptance/codecept.WebDriver.js --grep @WebDriverIO --debug
      - NODE_PATH=/codecept/lib
    depends_on:
      - php
      - selenium.chrome
    volumes:
      - .:/tests

  test-acceptance.puppeteer:
    build: ..
    env_file: .env
    working_dir: /tests
    environment:
      - CODECEPT_ARGS=-c acceptance/codecept.Puppeteer.js --grep @Puppeteer
      - PPT_VERSION=$PPT_VERSION
      - NODE_PATH=/codecept/lib
    depends_on:
      - php
      - puppeteer-image
    volumes:
      - .:/tests

  test-bdd.faker:
    build: ..
    env_file: .env
    environment:
      - CODECEPT_ARGS=-c codecept.faker.js
    volumes:
      - ./bdd:/tests
      - ./data:/data
      - ./support:/support

  selenium.chrome:
    image: selenium/standalone-chrome:4.26
    shm_size: 2g
    ports:
      - 4444:4444

  php:
    image: php:7.0
    command: php -S 0.0.0.0:8000 -t /test/data/app
    ports:
      - 8000:8000
    volumes:
      - .:/test

  json_server:
    <<: *test-service
    entrypoint: []
    command: /bin/bash /codecept/test/scripts/start-json-server.sh
    ports:
      - '8010:8010' # Expose to host
    restart: always # Automatically restart the container if it fails or becomes unhealthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8010/posts', (res) => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 10
      start_period: 5s

  mock_server:
    <<: *test-service
    entrypoint: []
    command: npm run mock-server:start
    ports:
      - '3001:3001' # Expose to host
    restart: always # Automatically restart the container if it fails or becomes unhealthy
    environment:
      - PORT=3001

  puppeteer-image:
    image: ghcr.io/puppeteer/puppeteer:22.4.1
