services:
  test-rest:
    <<: &test-service
      build: ..
      entrypoint: /codecept/node_modules/.bin/mocha
      working_dir: /codecept
      env_file: .env
      volumes:
        - ..:/codecept
    command: test/rest
    depends_on:
      - json_server

  test-acceptance.webdriverio:
    build: ..
    env_file: .env
    working_dir: /tests
    environment:
      - CODECEPT_ARGS=-c acceptance/codecept.WebDriver.js --grep @WebDriverIO --debug
      - NODE_PATH=/codecept/lib
    depends_on:
      - php
      - selenium.chrome
    volumes:
      - .:/tests

  test-acceptance.puppeteer:
    build: ..
    env_file: .env
    working_dir: /tests
    environment:
      - CODECEPT_ARGS=-c acceptance/codecept.Puppeteer.js --grep @Puppeteer
      - PPT_VERSION=$PPT_VERSION
      - NODE_PATH=/codecept/lib
    depends_on:
      - php
      - puppeteer-image
    volumes:
      - .:/tests

  test-bdd.faker:
    build: ..
    env_file: .env
    environment:
      - CODECEPT_ARGS=-c codecept.faker.js
    volumes:
      - ./bdd:/tests
      - ./data:/data
      - ./support:/support

  selenium.chrome:
    image: selenium/standalone-chrome:4.26
    shm_size: 2g
    ports:
      - 4444:4444

  php:
    image: php:7.0
    command: php -S 0.0.0.0:8000 -t /test/data/app
    ports:
      - 8000:8000
    volumes:
      - .:/test

  json_server:
    <<: *test-service
    entrypoint: []
    command: npm run json-server
    ports:
      - '8010:8010' # Expose to host
    restart: always # Automatically restart the container if it fails or becomes unhealthy

  puppeteer-image:
    image: ghcr.io/puppeteer/puppeteer:22.4.1
