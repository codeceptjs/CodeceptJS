name: Run Unit tests

on:
  push:
    branches:
      - 4.x
  pull_request:
    branches:
      - '**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    strategy:
      matrix:
        node-version: [26.x]

    steps:
      - uses: actions/checkout@v6
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm i
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: true
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: true
      - name: Start mock server
        run: nohup npm run mock-server:start &
      - name: Wait for mock server
        run: |
          for i in {1..20}; do
            curl -sSf http://localhost:3001/api/users && break
            sleep 1
          done
      - name: Start test server
        run: nohup npm run test-server:writable &
      - name: Wait for test server
        run: |
          for i in {1..20}; do
            curl -sSf http://localhost:8010/posts && break
            sleep 1
          done
      - run: npm run test:unit
      - run: npm run test:rest
      - name: Stop mock server
        run: npm run mock-server:stop

  unit-tests-windows:
    name: Unit tests
    runs-on: windows-latest
    timeout-minutes: 15

    strategy:
      matrix:
        node-version: [ 20.x ]

    steps:
      - uses: actions/checkout@v6
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm i
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: true
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: true
      - run: npm run test:unit:windows

  runner-tests:
    name: Runner tests
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - uses: actions/checkout@v6
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm i
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: true
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: true
      - name: Start mock server
        run: nohup npm run mock-server:start &
      - name: Wait for mock server
        run: |
          for i in {1..20}; do
            curl -sSf http://localhost:3001/api/users && break
            sleep 1
          done
      - run: npm run test:runner
      - name: Stop mock server
        run: npm run mock-server:stop
        # Note: Runner tests are mocha-based, so sharding doesn't apply here.
        # For CodeceptJS sharding examples, see sharding-demo.yml workflow.
