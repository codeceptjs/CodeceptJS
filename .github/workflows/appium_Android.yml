name: Appium Tests - Android

on:
  push:
    branches:
      - 4.x
  pull_request:
    branches:
      - 4.x

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  CI: true
  # Force terminal colors. @see https://www.npmjs.com/package/colors
  FORCE_COLOR: 1
  SAUCE_ACCESS_KEY: ${{ secrets.SAUCE_ACCESS_KEY }}
  SAUCE_USERNAME: ${{ secrets.SAUCE_USERNAME }}
  GH_PAT: ${{ github.token }}
  TESTOMATIO: ${{ secrets.TESTOMATIO }}

jobs:
  appium:
    # Run ONLY on the main repo AND (if it's a push OR a PR from the same repo)
    if: github.repository == 'codeceptjs/CodeceptJS' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    strategy:
      matrix:
        node-version: [20.x]
        test-suite: ['other', 'quick']

    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}

      - run: npm i
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: true
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: true

      - name: Upload APK to Sauce Labs
        run: |
          curl -u "$SAUCE_USERNAME:$SAUCE_ACCESS_KEY" \
          --location --request POST 'https://api.us-west-1.saucelabs.com/v1/storage/upload' \
          --form 'payload=@test/data/mobile/selendroid-test-app-0.17.0.apk' \
          --form 'name="selendroid-test-app-0.17.0.apk"'

      - run: 'timeout 900 bash -c "npm run test:appium-${{ matrix.test-suite }}"'
        timeout-minutes: 20
