name: WebDriver Tests

on:
  push:
    branches:
      - 4.x
  pull_request:
    branches:
      - '**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: true
  # Force terminal colors. @see https://www.npmjs.com/package/colors
  FORCE_COLOR: 1

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - run: docker run -d --net=host --shm-size=2g selenium/standalone-chrome:4.27
      - uses: actions/checkout@v6
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: 8.0
      - name: npm install
        run: |
          npm i
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: true
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: true
      # @codeceptjs/configure & @codeceptjs/expect-helper do `require('codeceptjs')`;
      # in this repo (where the project IS codeceptjs) Node has nothing at
      # node_modules/codeceptjs to resolve to. `npm link` fills the gap.
      # End users don't need this.
      - run: npm link && npm link codeceptjs
      - name: Start mock server
        run: nohup npm run mock-server:start &
      - name: Wait for mock server
        run: |
          for i in {1..20}; do
            curl -sSf http://localhost:3001/api/users && break
            sleep 1
          done
      - name: start a server
        run: 'php -S 127.0.0.1:8000 -t test/data/app &'
      - name: check
        run: './bin/codecept.js check -c test/acceptance/codecept.WebDriver.js'
        timeout-minutes: 2
        env:
          GH_PAT: ${{ github.token }}
          SELENIUM_HOST: localhost
          SELENIUM_PORT: 4444
      - name: run unit tests
        run: ./node_modules/.bin/mocha test/helper/WebDriver_test.js --exit --reporter @testomatio/reporter/mocha
        timeout-minutes: 10
        env:
          SELENIUM_HOST: localhost
          SELENIUM_PORT: 4444
      - name: run acceptance tests
        run: './bin/codecept.js run -c test/acceptance/codecept.WebDriver.js --grep @WebDriverIO --debug'
        env:
          SELENIUM_HOST: localhost
          SELENIUM_PORT: 4444
      - name: Stop mock server
        run: npm run mock-server:stop
