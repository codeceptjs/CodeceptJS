name: Plugins tests

on:
  push:
    branches:
      - 4.x
  pull_request:
    branches:
      - '**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: true
  # Force terminal colors. @see https://www.npmjs.com/package/colors
  FORCE_COLOR: 1

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - uses: actions/checkout@v6
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: 7.4
      - name: npm install
        run: |
          npm i --force
        env:
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: true
      # Self-link so deps that `import 'codeceptjs'` (configure, expect-helper) resolve.
      - run: ln -sfn .. node_modules/codeceptjs
      - name: Allow Release info Change
        run: |
          sudo apt-get update --allow-releaseinfo-change
      - name: Install browsers and deps
        run: npx playwright install chromium && npx playwright install-deps
      - name: start a server
        run: 'php -S 127.0.0.1:8000 -t test/data/app &'
      - name: run plugin tests
        run: npm run test:plugin
